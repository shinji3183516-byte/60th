<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   高岡工場 60th Anniversary Timeline
  </title>
  <script src="library/xlsx.full.min.js"></script>
 
  
  <link href="css/base.css?v=20260827-photo-radius-fix-v1" rel="stylesheet"/>
   <link id="themeStylesheet" href="css/theme-toyota.css?v=1" rel="stylesheet"/>
  <style id="opening-theme-position-override">
   /* オープニング画面：デザイン選択を以前の右下・縦型位置へ戻す */
   #openingPage > .opening-theme-picker {
     position: absolute !important;
     right: clamp(18px, 2vw, 36px) !important;
     bottom: clamp(58px, 7vh, 86px) !important;
     left: auto !important;
     top: auto !important;
     width: clamp(176px, 12.5vw, 210px) !important;
     max-width: none !important;
     margin: 0 !important;
     padding: 14px 12px 12px !important;
     border: 1px solid rgba(106, 210, 255, .52) !important;
     border-radius: 20px !important;
     background: rgba(4, 22, 38, .86) !important;
     box-shadow: 0 14px 34px rgba(0, 0, 0, .42), inset 0 0 22px rgba(68, 194, 255, .07) !important;
     backdrop-filter: blur(10px) !important;
     transform: none !important;
     translate: none !important;
     z-index: 120 !important;
   }

   #openingPage > .opening-theme-picker .opening-theme-picker__title {
     margin: 0 0 10px !important;
     text-align: left !important;
     font-size: clamp(12px, .9vw, 15px) !important;
     letter-spacing: .08em !important;
     color: #d9f5ff !important;
   }

   #openingPage > .opening-theme-picker .opening-theme-options {
     display: grid !important;
     grid-template-columns: 1fr !important;
     grid-auto-flow: row !important;
     gap: 7px !important;
     width: 100% !important;
   }

   #openingPage > .opening-theme-picker .theme-select-button,
   #openingPage > .opening-theme-picker .theme-select-button:last-child {
     grid-column: auto !important;
     width: 100% !important;
     min-width: 0 !important;
     min-height: 40px !important;
     padding: 7px 10px !important;
     border-radius: 0 !important;
     text-align: left !important;
     font-size: clamp(11px, .82vw, 14px) !important;
     background: rgba(3, 20, 34, .72) !important;
   }

   @media (max-width: 900px), (max-height: 720px) {
     #openingPage > .opening-theme-picker {
       right: 14px !important;
       bottom: 68px !important;
       width: 168px !important;
       padding: 11px 10px !important;
     }
     #openingPage > .opening-theme-picker .theme-select-button,
     #openingPage > .opening-theme-picker .theme-select-button:last-child {
       min-height: 34px !important;
       padding: 5px 8px !important;
     }
   }
  </style>
<script defer="" src="script.js?v=20260827-photo-radius-fix-v1">
  </script>
</head>
 <body class="opening-active">
  <audio id="bgm" preload="none" hidden></audio>
  <div class="offline-excel-panel" aria-label="オフラインExcel読込">
    <button id="offlineExcelButton" type="button">Excelを読み込む</button>
    <input id="offlineExcelInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <span id="offlineExcelStatus">Excel読込待ち</span>
  </div>


  <!-- ======================================================
       デジタル年表 オープニング
       背景画像: images/opening/top-page.jpg
  ======================================================= -->
<section
  id="openingPage"
  class="opening-page"
  aria-label="高岡工場60周年デジタル年表 オープニング"
>
 
  <div class="opening-page__shade" aria-hidden="true"></div>

  <div class="opening-controls">
    <div class="opening-meter" aria-live="polite">
      <svg
        class="opening-meter__svg"
        viewBox="0 0 260 155"
        role="img"
        aria-label="年表読み込みメーター"
      >
        <defs>
          <linearGradient
            id="openingMeterGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="0%"
          >
            <stop offset="0%" stop-color="#f5b74d"></stop>
            <stop offset="48%" stop-color="#fff7d1"></stop>
            <stop offset="100%" stop-color="#4dd4ff"></stop>
          </linearGradient>
        </defs>

        <path
          class="opening-meter__track"
          d="M30 130 A100 100 0 0 1 230 130"
        ></path>

        <path
          id="openingMeterProgress"
          class="opening-meter__progress"
          d="M30 130 A100 100 0 0 1 230 130"
        ></path>

        <g class="opening-meter__ticks" aria-hidden="true">
          <line x1="30" y1="130" x2="43" y2="130"></line>
          <line x1="43" y1="80" x2="55" y2="87"></line>
          <line x1="80" y1="43" x2="87" y2="55"></line>
          <line x1="130" y1="30" x2="130" y2="44"></line>
          <line x1="180" y1="43" x2="173" y2="55"></line>
          <line x1="217" y1="80" x2="205" y2="87"></line>
          <line x1="230" y1="130" x2="217" y2="130"></line>
        </g>

        <g
          id="openingMeterNeedle"
          class="opening-meter__needle"
          aria-hidden="true"
        >
          <line x1="130" y1="130" x2="130" y2="57"></line>
          <circle cx="130" cy="130" r="7"></circle>
        </g>
      </svg>

      <div class="opening-meter__readout">
        <strong id="openingMeterValue">0%</strong>
        <span id="openingMeterLabel">READY</span>
      </div>
    </div>


    <button
      id="openingStartButton"
      class="opening-start-button"
      type="button"
    >
      <span>年表をはじめる</span>
      <span
        class="opening-start-button__arrow"
        aria-hidden="true"
      >›</span>
    </button>

    <p class="opening-controls__caption">
      未来へ続く物語をめぐる
    </p>
  </div>

  <section class="opening-theme-picker" aria-label="デザインテーマ選択">
    <p class="opening-theme-picker__title">デザインを選択</p>
    <div class="opening-theme-options">
      <button class="theme-select-button" type="button" data-theme="toyota">TOYOTA</button>
      <button class="theme-select-button" type="button" data-theme="anime">アニメ</button>
      <button class="theme-select-button" type="button" data-theme="colorful">カラフル</button>
      <button class="theme-select-button" type="button" data-theme="healing">ヒーリング</button>
      <button class="theme-select-button" type="button" data-theme="monotone">モノトーン</button>
      <button class="theme-select-button" type="button" data-theme="country">COUNTRY</button>
    </div>
  </section>
</section>
  <main class="page">
   <header class="header">
    <div class="title-area">
     <img alt="トヨタマーク" class="mark" src="images/logo/toyotamark.jpg?v=20260826"/>
     <div>
      <h1>
       <span>
        高岡工場 60th Anniversary
       </span>
       TIMELINE 1966-2026
      </h1>
     </div>
    </div>
    <div aria-label="年表操作" class="header-actions">
     <details class="header-uploader">
      <summary>写真・文章を追加</summary>
      <div class="header-uploader-menu">
       <div class="header-uploader-topline">
        <strong>選択中の年代へ一時追加</strong>
        <small id="editorYearLabel">1966年に追加</small>
       </div>
       <div class="editor-grid">
        <label>
         追加先
         <select id="editorTarget">
          <option value="car">車紹介</option>
          <option value="plant">工場の出来事</option>
          <option value="society">社会の出来事</option>
         </select>
        </label>
        <label>
         写真追加（最大3枚）
         <input accept="image/*" id="editorImages" multiple type="file"/>
        </label>
        <label class="editor-text-label">
         文章追加
         <textarea id="editorText" placeholder="選択中の年代に追加する文章" rows="2"></textarea>
        </label>
        <div class="editor-buttons">
         <button id="addEditorText" type="button">文章を追加</button>
         <button id="clearEditorAdditions" type="button">一時追加をリセット</button>
        </div>
       </div>
       <p class="editor-note">ブラウザ内への一時追加です。正式保存する場合は画像をimagesフォルダへ入れ、script.jsへ画像パスを追加してください。</p>
      </div>
     </details>
     <div class="cycle-timer" id="cycleTimer" role="timer" aria-live="off" title="現在の速度と登録年代数から1サイクルの残り時間を計算します">
      <span class="cycle-timer-label">1サイクル残り</span>
      <strong id="cycleRemainingSeconds">--</strong>
      <span class="cycle-timer-unit">秒</span>
     </div>
      <div aria-label="年表の速度切替" class="speed-control">
      <button class="speed-button" data-speed="verySlow" type="button">
       遅い
      </button>
      <button class="speed-button" data-speed="slow" type="button">
       やや遅い
      </button>
      <button class="speed-button active" data-speed="normal" type="button">
       普通
      </button>
     </div>
     <div aria-label="年表の再生操作" class="play-control">
      <button class="control-button" id="pauseButton" type="button">
       停止
      </button>
      <button class="control-button" id="playButton" type="button">
       再開
      </button>
     </div>
     <!-- 高岡60周年公式ロゴ　無断使用・転載・転用禁止 -->
     <img alt="高岡工場60周年ロゴ" class="archive-logo" src="images/logo/60thLOGO.jpeg"/>
    </div>
   </header>
   <section aria-label="自動スクロール年表" class="timeline-frame" id="timelineFrame">
    <div aria-hidden="true" class="center-line">
    </div>
    <div class="track-mask">
     <div class="timeline-track" id="timelineTrack">
     </div>
    </div>
    <p class="pause-note">
     年表にマウスを乗せると、年表と下の表示が同時に止まります
    </p>
   </section>
   <div aria-label="歴代車走行ステージ" class="drive-stage drive-stage-full" id="driveStage">
    <div aria-hidden="true" class="drive-bg">
    </div>
    <div aria-hidden="true" class="weather-effects">
     <div class="weather-clouds"></div>
     <div class="weather-rain"></div>
     <div class="weather-night-lights"></div>
    </div>
    <div aria-hidden="true" class="drive-cars" id="driveCars">
     <div class="drive-car-slot car-slot-1966">
      <img alt="" class="drive-car car-1966" src="images/run-cars/corolla-60th.png"/>
     </div>
     <div class="drive-car-slot car-slot-1970">
      <img alt="" class="drive-car car-1970" src="images/run-cars/corolla-green.png"/>
     </div>
     <div class="drive-car-slot car-slot-1980">
      <img alt="" class="drive-car car-1980" src="images/run-cars/levin.png"/>
     </div>
     <div class="drive-car-slot car-slot-1990">
      <img alt="" class="drive-car car-1990" src="images/run-cars/prius.png"/>
     </div>
     <div class="drive-car-slot car-slot-2000">
      <img alt="" class="drive-car car-2000" src="images/run-cars/iQ.png"/>
     </div>
     <div class="drive-car-slot car-slot-2010">
      <img alt="" class="drive-car car-2010" src="images/run-cars/hayy.png"/>
     </div>
     <div class="drive-car-slot car-slot-2020">
      <img alt="" class="drive-car car-2020" src="images/run-cars/rav4-silver.png"/>
     </div>
    </div>
   </div>
   <section class="main-card">
    <div class="left-panel">
     <p class="label">
      SELECTED YEAR
     </p>
     <div class="year-line year-line--with-title">
      <span class="big-year" id="selectedYear">
       1966
      </span>
      <div class="selected-year-meta">
       <h2 id="selectedTitle">
        高岡工場スタート
       </h2>
       <span class="era-badge" id="selectedEra">
        昭和41年
       </span>
      </div>
     </div>
     <button class="photo-link" data-placeholder="メイン写真を追加してください" id="photoLink" type="button">
      <img alt="選択された年代の写真" id="mainPhoto"/>
      <span>
       画像を開く
      </span>
     </button>
    </div>
    <div class="right-area">
     <div class="event-grid">
      <article>
       <div class="article-content" id="carContent">
       </div>
      </article>
      <article>
       <div class="article-content" id="factoryContent">
       </div>
      </article>
      <article>
       <div class="article-content" id="societyContent">
       </div>
      </article>
     </div>
    </div>
   </section>
  </main>
  <script>
   (() => {
    const stage = document.getElementById("driveStage");
    if (!stage) return;

    const weatherModes = ["sunny", "cloudy", "night"];
    let weatherIndex = 0;

    const applyWeather = () => {
     stage.classList.remove(...weatherModes);
     stage.classList.add(weatherModes[weatherIndex]);
     weatherIndex = (weatherIndex + 1) % weatherModes.length;
    };

    applyWeather();
    window.setInterval(applyWeather, 30000);
   })();
  </script>
 </body>
</html>
